name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runtime dependencies must have no advisories at all. The ESLint toolchain's minimatch is fixed
      # only in minimatch 11, which ESLint cannot use yet, so the full tree gates on high and critical.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev

      - name: Audit all dependencies
        run: npm audit --audit-level=high

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
